<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#137a9a">
<meta name="description" content="Steer your pirate ship between storm clouds and sandbars and sink the King's navy. Plays entirely on your device.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reef Runner">
<title>Reef Runner</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script>
  // Phones and tablets get on-screen SAIL / FIRE buttons. Decided before first paint;
  // a touch on a device that didn't report a coarse pointer switches them on later.
  if (window.matchMedia('(pointer: coarse)').matches) document.documentElement.classList.add('touch');
</script>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d3b4f;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  #rotate {
    display: none; position: fixed; top: 16px; left: 0; right: 0;
    text-align: center; color: #bfe9ef; pointer-events: none;
    font: 600 15px "Trebuchet MS", system-ui, sans-serif;
  }
  @media (orientation: portrait) { html:not(.touch) #rotate { display: block; } }

  /* ---------- phone controls ---------- */
  #pad, .corner { display: none; }
  html.touch #pad { display: flex; }
  html.touch .corner { display: grid; }
  .pbtn {
    -webkit-appearance: none; appearance: none; margin: 0;
    touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    font: 900 18px/1 "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    color: #1c1512; letter-spacing: .04em;
    border: 4px solid #1c1512; box-shadow: 0 6px 0 #1c1512;
    display: grid; place-items: center; align-content: center; gap: 6px;
    position: relative; cursor: pointer;
    transition: transform .06s, box-shadow .06s;
  }
  .pbtn.down { transform: translateY(4px); box-shadow: 0 2px 0 #1c1512; }
  .pbtn:focus-visible { outline: 3px solid #ffd34e; outline-offset: 3px; }
  #pad {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    justify-content: space-between; align-items: flex-end; pointer-events: none;
    padding: 0 max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  #pad .pbtn { pointer-events: auto; width: 92px; height: 92px; border-radius: 50%; }
  #btn-sail { background: rgba(245, 226, 181, .88); }
  #btn-fire { background: rgba(255, 211, 78, .9); }
  #btn-fire.rum { background: rgba(255, 110, 70, .92); }
  .glyph { font-size: 26px; line-height: .8; }
  .ball { width: 22px; height: 22px; border-radius: 50%; background: #26262b; box-shadow: inset -4px -4px 0 #3d3d45; border: 2px solid #1c1512; }
  /* Reload ring: fills clockwise as the cannon reloads. */
  #btn-fire::before {
    content: ""; position: absolute; inset: 5px; border-radius: inherit;
    background: conic-gradient(#1c1512 calc(var(--ready, 1) * 1turn), transparent 0);
    -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
            mask: radial-gradient(closest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    opacity: .55; pointer-events: none;
  }
  #btn-fire:not(.ready) .ball { opacity: .45; }

  /* Portrait: the same round buttons as landscape, on a slim wooden deck below the sea. */
  @media (orientation: portrait) {
    #pad {
      height: calc(124px + env(safe-area-inset-bottom));
      align-items: center; padding-top: 0; pointer-events: auto;
      background:
        repeating-linear-gradient(to bottom, #8a5a30 0 30px, #6e4522 30px 33px),
        #8a5a30;
      border-top: 5px solid #1c1512;
      box-shadow: inset 0 6px 0 rgba(255, 255, 255, .12);
    }
    #btn-sail { background: #f5e2b5; }
    #btn-fire { background: #ffd34e; }
    #btn-fire.rum { background: #ff6e46; }
  }

  .corner {
    position: fixed; z-index: 6; width: 44px; height: 44px; border-radius: 50%;
    place-items: center; font-size: 18px; line-height: 1;
    background: rgba(28, 21, 18, .45); color: #fff; border: 2px solid rgba(255, 255, 255, .5);
    top: max(12px, env(safe-area-inset-top));
    -webkit-appearance: none; appearance: none; padding: 0; touch-action: none;
  }
  #btn-pause { left: max(12px, env(safe-area-inset-left)); }
  #btn-mute { right: max(12px, env(safe-area-inset-right)); }
  #btn-pause[hidden] { display: none; }

  #splash {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin;
    background: radial-gradient(circle at 50% 42%, #1d7fb8 0%, #0d3b4f 70%);
    transition: opacity 0.5s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash img {
    width: min(70vmin, 520px); height: auto;
    filter: drop-shadow(0 1.5vmin 2vmin rgba(0, 0, 0, 0.45));
    animation: bob 2.4s ease-in-out infinite;
  }
  #splash .bar {
    width: min(40vmin, 260px); height: 12px; border-radius: 6px;
    background: #0a2a38; border: 3px solid #1c1512; overflow: hidden;
  }
  #splash .bar i {
    display: block; height: 100%; width: 0; background: #ffd34e;
    animation: fill 1.2s ease-out forwards;
  }
  @keyframes bob { 50% { transform: translateY(-1.5vmin) rotate(-1deg); } }
  @keyframes fill { to { width: 100%; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="splash"><img src="assets/logo-600.webp" alt="Reef Runner"><div class="bar"><i></i></div></div>
<div id="rotate">Turn your phone sideways for a bigger sea ↻</div>
<div id="pad">
  <button class="pbtn" id="btn-sail" aria-label="Sail up"><span class="glyph" aria-hidden="true">▲</span>SAIL</button>
  <button class="pbtn ready" id="btn-fire" aria-label="Fire"><span class="ball" aria-hidden="true"></span><span class="label">FIRE</span></button>
</div>
<button class="corner" id="btn-pause" aria-label="Pause" hidden>❚❚</button>
<button class="corner" id="btn-mute" aria-label="Mute sound">🔊</button>
<script>
  // Loading screen: shows the logo until everything has loaded (at least 1.2 s),
  // then fades. A tap or key skips it without also starting the game;
  // registered before game.js so it always sees input first.
  (() => {
    const splash = document.getElementById('splash');
    const started = performance.now();
    let up = true;
    const hide = () => { if (up) { up = false; splash.classList.add('gone'); } };
    const swallow = e => { if (up) { e.stopImmediatePropagation(); e.preventDefault(); hide(); } };
    window.addEventListener('pointerdown', swallow, true);
    // First real touch on a device that didn't advertise touch: bring up the buttons.
    window.addEventListener('pointerdown', e => {
      const root = document.documentElement;
      if (e.pointerType === 'touch' && !root.classList.contains('touch')) {
        root.classList.add('touch');
        window.dispatchEvent(new Event('resize'));
      }
    }, true);
    window.addEventListener('keydown', swallow, true);
    window.addEventListener('load', () => setTimeout(hide, Math.max(0, 1200 - (performance.now() - started))));
  })();
</script>
<!-- Classic scripts (not ES modules) so the game also runs when opened as a local file. -->
<script src="js/art.js"></script>
<script src="js/sfx.js"></script>
<script src="js/game.js"></script>
<script>
  // Offline support when served over http(s); a double-clicked file doesn't need it.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
