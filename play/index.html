<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#137a9a">
<meta name="description" content="Steer your pirate ship between storm clouds and sandbars and sink the King's navy. Plays entirely on your device.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reef Runner">
<title>Reef Runner</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d3b4f;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  #rotate {
    display: none; position: fixed; top: 16px; left: 0; right: 0;
    text-align: center; color: #bfe9ef; pointer-events: none;
    font: 600 15px "Trebuchet MS", system-ui, sans-serif;
  }
  @media (orientation: portrait) { #rotate { display: block; } }

  #splash {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin;
    background: radial-gradient(circle at 50% 42%, #1d7fb8 0%, #0d3b4f 70%);
    transition: opacity 0.5s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash img {
    width: min(70vmin, 520px); height: auto;
    filter: drop-shadow(0 1.5vmin 2vmin rgba(0, 0, 0, 0.45));
    animation: bob 2.4s ease-in-out infinite;
  }
  #splash .bar {
    width: min(40vmin, 260px); height: 12px; border-radius: 6px;
    background: #0a2a38; border: 3px solid #1c1512; overflow: hidden;
  }
  #splash .bar i {
    display: block; height: 100%; width: 0; background: #ffd34e;
    animation: fill 1.2s ease-out forwards;
  }
  @keyframes bob { 50% { transform: translateY(-1.5vmin) rotate(-1deg); } }
  @keyframes fill { to { width: 100%; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="splash"><img src="assets/logo-600.webp" alt="Reef Runner"><div class="bar"><i></i></div></div>
<div id="rotate">Turn your phone sideways for a bigger sea ↻</div>
<script>
  // Loading screen: shows the logo until everything has loaded (at least 1.2 s),
  // then fades. A tap or key skips it without also starting the game;
  // registered before game.js so it always sees input first.
  (() => {
    const splash = document.getElementById('splash');
    const started = performance.now();
    let up = true;
    const hide = () => { if (up) { up = false; splash.classList.add('gone'); } };
    const swallow = e => { if (up) { e.stopImmediatePropagation(); e.preventDefault(); hide(); } };
    window.addEventListener('pointerdown', swallow, true);
    window.addEventListener('keydown', swallow, true);
    window.addEventListener('load', () => setTimeout(hide, Math.max(0, 1200 - (performance.now() - started))));
  })();
</script>
<!-- Classic scripts (not ES modules) so the game also runs when opened as a local file. -->
<script src="js/art.js"></script>
<script src="js/sfx.js"></script>
<script src="js/game.js"></script>
<script>
  // Offline support when served over http(s); a double-clicked file doesn't need it.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
