<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cloud Dancer: Beyond the Reef</title>
<meta name="description" content="A steampunk pirate airship shooter: steer the Cloud Dancer through three layers of sky and broadside the King's Aerial Navy. Runs entirely on your device.">
<meta name="theme-color" content="#2f7fd6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Cloud Dancer">
<meta name="application-name" content="Cloud Dancer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #10182f; overflow: hidden; }
  body { display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  /* ---- phone controls (touch devices, during play) ---- */
  #steer, #btn-steam, .corner { display: none; }
  html.touch[data-state="play"] #steer, html.touch[data-state="play"] #btn-steam { display: block; }
  html.touch .corner { display: grid; }
  #steer { position: fixed; left: 0; top: 0; bottom: 0; width: 70vw; z-index: 4; touch-action: none; }
  #btn-steam { position: fixed; z-index: 5; width: 78px; height: 78px; border-radius: 50%; touch-action: none;
    right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom));
    border: 3px solid rgba(255,255,255,.7); background: rgba(217,164,65,.55); color: #fff;
    font: 800 12px/1.1 "Trebuchet MS", system-ui, sans-serif; text-shadow: 0 1px 0 #2a1a12; -webkit-appearance: none; appearance: none; padding: 0; }
  #btn-steam.down { background: rgba(255,211,78,.8); transform: scale(.95); }
  .corner { position: fixed; z-index: 6; width: 40px; height: 40px; border-radius: 50%; place-items: center;
    top: max(10px, env(safe-area-inset-top)); background: rgba(16,24,48,.5); color: #fff; border: 2px solid rgba(255,255,255,.5);
    font: bold 15px/1 ui-monospace, Menlo, monospace; -webkit-appearance: none; appearance: none; padding: 0; touch-action: none; }
  #btn-pause { left: max(10px, env(safe-area-inset-left)); }
  #btn-mute { right: max(10px, env(safe-area-inset-right)); }
  html.touch:not([data-state="play"]) #btn-pause { display: none; }
  html.muted #btn-mute { background: rgba(120,30,30,.6); }
  html.touch:is([data-state="hangar"], [data-state="market"]) .corner { display: none; }
  /* A sideways hint under the steering zone, shown once per run start (js/game.js fades it). */
  #steer::after { content: "drag anywhere to steer"; position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    color: rgba(255,255,255,.7); font: 700 12px "Trebuchet MS", system-ui, sans-serif; text-shadow: 0 1px 0 #10182f;
    opacity: 0; transition: opacity .6s; pointer-events: none; white-space: nowrap; }
  html.hint #steer::after { opacity: 1; }
  /* An upright phone: the game fills the width at the top; below it, the whole screen steers and
     FULL STEAM sits bottom-right, bigger. */
  @media (orientation: portrait) {
    html.touch body { place-items: start center; padding-top: calc(max(10px, env(safe-area-inset-top)) + 52px); box-sizing: border-box; }
    html.touch #steer { width: 100vw; }
    html.touch #btn-steam { width: 96px; height: 96px; font-size: 14px; bottom: calc(max(20px, env(safe-area-inset-bottom)) + 30px); }
  }
  @media (prefers-reduced-motion: reduce) { #btn-steam.down { transform: none; } }
  /* The logo for the first moment (js/game.js fades it). */
  #splash { position: fixed; inset: 0; margin: auto; width: min(70vw, 70vh, 480px); z-index: 30; pointer-events: none; }
  #splash.gone { opacity: 0; transition: opacity .5s; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<img id="splash" src="assets/logo.png" alt="">
<canvas id="game" role="img" aria-label="Cloud Dancer, a pirate airship game" aria-describedby="game-help"></canvas>
<p id="game-help" class="sr-only">A side-scrolling airship game. Steer with the arrow keys or WASD, or drag on the left of a touch
  screen. The cannons fire on their own. Space, or the STEAM button, dashes forward. P pauses, M mutes.</p>
<p id="status" class="sr-only" aria-live="polite"></p>
<div id="steer"></div>
<button id="btn-steam" aria-label="Full steam">FULL<br>STEAM</button>
<button class="corner" id="btn-pause" aria-label="Pause">II</button>
<button class="corner" id="btn-mute" aria-label="Mute sound" aria-pressed="false">&#9834;</button>
<!-- Classic scripts (not ES modules) so the game also runs when opened as a local file. -->
<script>
  // Offline support when served over http(s); a double-clicked file doesn't need it.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
<script src="js/core.js"></script>
<script src="js/ship.js"></script>
<script src="js/areas.js"></script>
<script src="js/weapons.js"></script>
<script src="js/enemies.js"></script>
<script src="js/bosses.js"></script>
<script src="js/world.js"></script>
<script src="js/market.js"></script>
<script src="js/save.js"></script>
<script src="js/touch.js"></script>
<script src="js/sfx.js"></script>
<script src="js/music.js"></script>
<script src="js/sprites.js"></script>
<script src="js/art.js"></script>
<script src="js/pad.js"></script>
<script src="js/game.js"></script>
</body>
</html>
