<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d3b4f;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  #rotate {
    display: none; position: fixed; top: 16px; left: 0; right: 0;
    text-align: center; color: #bfe9ef; pointer-events: none;
    font: 600 15px "Trebuchet MS", system-ui, sans-serif;
  }
  @media (orientation: portrait) { #rotate { display: block; } }

  #splash {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin;
    background: radial-gradient(circle at 50% 42%, #1d7fb8 0%, #0d3b4f 70%);
    transition: opacity 0.5s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash img {
    width: min(70vmin, 520px); height: auto;
    filter: drop-shadow(0 1.5vmin 2vmin rgba(0, 0, 0, 0.45));
    animation: bob 2.4s ease-in-out infinite;
  }
  #splash .bar {
    width: min(40vmin, 260px); height: 12px; border-radius: 6px;
    background: #0a2a38; border: 3px solid #1c1512; overflow: hidden;
  }
  #splash .bar i {
    display: block; height: 100%; width: 0; background: #ffd34e;
    animation: fill 1.2s ease-out forwards;
  }
  @keyframes bob { 50% { transform: translateY(-1.5vmin) rotate(-1deg); } }
  @keyframes fill { to { width: 100%; } }
</style>

<script>
  // Loading screen: shows the logo until everything has loaded (at least 1.2 s),
  // then fades. A tap or key skips it without also starting the game;
  // registered before game.js so it always sees input first.
  (() => {
    const splash = document.getElementById('splash');
    const started = performance.now();
    let up = true;
    const hide = () => { if (up) { up = false; splash.classList.add('gone'); } };
    const swallow = e => { if (up) { e.stopImmediatePropagation(); e.preventDefault(); hide(); } };
    window.addEventListener('pointerdown', swallow, true);
    window.addEventListener('keydown', swallow, true);
    window.addEventListener('load', () => setTimeout(hide, Math.max(0, 1200 - (performance.now() - started))));
  })();
</script>
<!-- Classic scripts (not ES modules) so the game also runs when opened as a local file. -->
<script>
// Cartoon art, all drawn in code: thick ink outlines, flat bright fills.
// Palette follows the Reef Runner logo: black skull sail, red-and-wood hull,
// sandbars below, storm clouds above, bright blue day sky.
window.Art = (() => {
  'use strict';
  const INK = '#1c1512';
  const TAU = Math.PI * 2;

  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function shapePath(ctx, s) {
    if (s.w === undefined) ctx.arc(s.x, s.y, s.r, 0, TAU);
    else rr(ctx, s.x, s.y, s.w, s.h, s.r || 0);
  }

  // Stroke every piece in ink first, then fill them all on top, so overlapping
  // circles and boxes read as one outlined cartoon blob.
  function blob(ctx, shapes, fill, outline = 6) {
    ctx.lineJoin = 'round';
    ctx.strokeStyle = INK;
    ctx.lineWidth = outline;
    for (const s of shapes) { ctx.beginPath(); shapePath(ctx, s); ctx.stroke(); }
    ctx.fillStyle = fill;
    for (const s of shapes) { ctx.beginPath(); shapePath(ctx, s); ctx.fill(); }
  }

  function box(ctx, x, y, w, h, fill, r = 1) {
    ctx.fillStyle = fill;
    ctx.beginPath(); rr(ctx, x, y, w, h, r); ctx.fill(); ctx.stroke();
  }

  // Pirate ship from the app icon, facing right; origin at the hull's waterline middle.
  function ship(ctx, x, y, tilt, stretch, t, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    ctx.scale(scale * (1 - stretch * 0.14), scale * (1 + stretch * 0.14));
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;

    box(ctx, -3, -60, 6, 58, '#6b4423', 2);

    // Red pennant streaming back from the masthead.
    const w = Math.sin(t * 10) * 2.5;
    ctx.fillStyle = '#e0392d';
    ctx.beginPath();
    ctx.moveTo(-1, -60);
    ctx.quadraticCurveTo(-12, -64 + w, -26, -60 + w * 1.5);
    ctx.quadraticCurveTo(-14, -56 + w, -1, -53);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e8b23a';
    ctx.beginPath(); ctx.arc(0, -62, 3, 0, TAU); ctx.fill(); ctx.stroke();

    box(ctx, -24, -51, 46, 5, '#6b4423', 2);

    // Black sail, billowing.
    const puff = Math.sin(t * 3) * 2;
    ctx.fillStyle = '#232327';
    ctx.beginPath();
    ctx.moveTo(-21, -46);
    ctx.lineTo(18, -46);
    ctx.quadraticCurveTo(28 + puff, -28, 16, -12);
    ctx.lineTo(-19, -12);
    ctx.quadraticCurveTo(-10 + puff, -29, -21, -46);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#44444c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, -44); ctx.quadraticCurveTo(-2 + puff, -29, -8, -14); ctx.stroke();

    // Skull and crossbones.
    const bone = '#f4efe2';
    ctx.strokeStyle = bone; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-2, -26); ctx.lineTo(14, -17); ctx.moveTo(14, -26); ctx.lineTo(-2, -17); ctx.stroke();
    ctx.fillStyle = bone;
    for (const [bx, by] of [[-2, -26], [14, -17], [14, -26], [-2, -17]]) {
      ctx.beginPath(); ctx.arc(bx, by, 2.2, 0, TAU); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(6, -33, 6, 0, TAU); ctx.fill();
    ctx.beginPath(); rr(ctx, 2.5, -30, 7, 6, 2); ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(3.8, -33.5, 1.7, 0, TAU); ctx.arc(8.2, -33.5, 1.7, 0, TAU); ctx.fill();

    // Cargo crates on deck.
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    box(ctx, -31, -21, 12, 12, '#c08a45');
    box(ctx, -18, -23, 14, 14, '#c9944d');
    ctx.strokeStyle = '#7a5226'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-29, -19); ctx.lineTo(-21, -11); ctx.moveTo(-21, -19); ctx.lineTo(-29, -11);
    ctx.moveTo(-16, -21); ctx.lineTo(-6, -11); ctx.moveTo(-6, -21); ctx.lineTo(-16, -11);
    ctx.stroke();

    // Hull: wood with a red upper band, gold rail and an upswept bow.
    const hull = () => {
      ctx.beginPath();
      ctx.moveTo(-36, -10);
      ctx.lineTo(30, -10);
      ctx.quadraticCurveTo(39, -11, 46, -22);
      ctx.quadraticCurveTo(41, 15, 2, 19);
      ctx.quadraticCurveTo(-27, 19, -36, -10);
      ctx.closePath();
    };
    ctx.save();
    hull(); ctx.fillStyle = '#9a6232'; ctx.fill(); ctx.clip();
    ctx.fillStyle = '#c0392b'; ctx.fillRect(-40, -24, 90, 23);
    ctx.strokeStyle = '#6e4420'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-34, 8); ctx.lineTo(40, 6); ctx.moveTo(-30, 14); ctx.lineTo(34, 12); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = '#e8b23a'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-35, -9); ctx.lineTo(30, -9); ctx.quadraticCurveTo(38, -10, 45, -21); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    hull(); ctx.stroke();
    ctx.fillStyle = '#e8b23a';
    ctx.beginPath(); ctx.arc(46, -22, 3.2, 0, TAU); ctx.fill(); ctx.stroke();

    // Cannon muzzles.
    for (const cx of [-17, 5]) {
      ctx.fillStyle = INK;
      ctx.beginPath(); rr(ctx, cx - 5, -1, 10, 8, 2); ctx.fill();
      ctx.fillStyle = '#3a3a40';
      ctx.beginPath(); ctx.arc(cx, 3, 3, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // Sandbar rising from the sea floor; `top` is the upper edge of the hitbox.
  function sandbar(ctx, x, top, w, far, s) {
    const foot = far - Math.min(70, (far - top) * 0.45);   // where the dune flares out
    const outline = () => {
      ctx.beginPath();
      ctx.moveTo(x - 30, far);
      ctx.quadraticCurveTo(x - 4, foot, x - 3, top + 34);
      ctx.bezierCurveTo(x, top + 4, x + w * 0.2, top, x + w * s.peak, top);
      ctx.bezierCurveTo(x + w * 0.8, top, x + w, top + 4, x + w + 3, top + 34);
      ctx.quadraticCurveTo(x + w + 4, foot, x + w + 30, far);
      ctx.closePath();
    };
    ctx.save();
    outline();
    ctx.fillStyle = '#f2cf82';
    ctx.fill();
    ctx.clip();
    ctx.fillStyle = '#d9ad5e';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.72, top); ctx.lineTo(x + w + 20, top); ctx.lineTo(x + w + 20, far); ctx.lineTo(x + w * 0.85, far);
    ctx.fill();
    ctx.fillStyle = '#fbe3aa';
    ctx.beginPath(); ctx.ellipse(x + w * 0.35, top + 12, w * 0.22, 5, 0, 0, TAU); ctx.fill();
    // Wind ripples in the sand.
    ctx.strokeStyle = '#c99a4c'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (const r of s.ripples) {
      const ry = top + r.v;
      ctx.beginPath();
      ctx.moveTo(x + w * r.u, ry);
      ctx.quadraticCurveTo(x + w * (r.u + 0.1), ry - 4, x + w * (r.u + 0.2), ry);
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    outline(); ctx.stroke();

    // Beachcombing details: a shell and sometimes a starfish.
    ctx.lineWidth = 2;
    const sx = x + w * s.shell.u, sy = top + s.shell.v;
    ctx.fillStyle = '#ffd6de';
    ctx.beginPath(); ctx.arc(sx, sy, 5, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    if (s.star) {
      const cx = x + w * s.star.u, cy = top + s.star.v;
      ctx.fillStyle = '#ff8a4c';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 5, r = i % 2 ? 3 : 8;
        ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  // Storm cloud bank hanging down from the sky; `bottom` is the lower edge of the hitbox.
  function stormCloud(ctx, x, bottom, w, s, t) {
    const puffs = s.puffs.map(p => ({ x: x + p.u * w, y: bottom - p.r - p.lift, r: p.r }));
    // Billows down both sides so the bank reads as cloud, not a pillar.
    const sides = [];
    for (let y = bottom - 34, i = 0; y > -30; y -= 26, i++) {
      const j = s.jitter[i % s.jitter.length];
      sides.push({ x: x + 4 + j, y, r: 15 }, { x: x + w - 4 - j, y: y - 12, r: 15 });
    }
    const body = { x: x + 2, y: -40, w: w - 4, h: bottom - 14 + 40, r: 12 };
    blob(ctx, [body, ...sides, ...puffs], '#50566b', 5);
    ctx.fillStyle = '#687089';
    for (const p of [...sides, ...puffs]) {
      ctx.beginPath(); ctx.arc(p.x - p.r * 0.25, p.y - p.r * 0.3, p.r * 0.5, 0, TAU); ctx.fill();
    }

    // Rain streaks and the odd lightning flicker below the cloud.
    ctx.strokeStyle = 'rgba(200,220,255,0.55)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const rx = x + ((i + 0.5) / 4) * w;
      const ry = bottom + 4 + ((t * 160 + i * 23 + s.phase * 40) % 26);
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 3, ry + 7); ctx.stroke();
    }
    if ((t + s.phase) % 2.6 < 0.14) {
      const bx = x + w * s.bolt;
      ctx.lineJoin = 'miter';
      for (const [col, lw] of [[INK, 7], ['#ffe14d', 3.5]]) {
        ctx.strokeStyle = col; ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.moveTo(bx, bottom - 6); ctx.lineTo(bx - 7, bottom + 10); ctx.lineTo(bx + 3, bottom + 12); ctx.lineTo(bx - 5, bottom + 28);
        ctx.stroke();
      }
      ctx.lineJoin = 'round';
    }
  }

  // Random look for one obstacle pair, generated once so it doesn't flicker.
  function makeObstacle() {
    const rnd = (a, b) => a + Math.random() * (b - a);
    return {
      peak: rnd(0.4, 0.6),
      ripples: Array.from({ length: 3 }, (_, i) => ({ u: rnd(0.1, 0.6), v: 40 + i * 45 + rnd(0, 20) })),
      shell: { u: rnd(0.2, 0.8), v: rnd(24, 60) },
      star: Math.random() < 0.4 ? { u: rnd(0.25, 0.75), v: rnd(70, 120) } : null,
      puffs: [0.08, 0.38, 0.66, 0.94].map((u, i) => ({ u, r: rnd(15, 20), lift: i === 1 || i === 2 ? 0 : rnd(4, 12) })),
      jitter: Array.from({ length: 5 }, () => rnd(-3, 4)),
      bolt: rnd(0.3, 0.7),
      phase: rnd(0, 2.6),
    };
  }

  function unionJack(ctx, x, y, w, h) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = '#1f3f8f'; ctx.fillRect(x, y, w, h);
    ctx.lineCap = 'butt';
    const diag = (col, lw) => {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); ctx.moveTo(x + w, y); ctx.lineTo(x, y + h); ctx.stroke();
    };
    const cross = (col, lw) => {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h); ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2); ctx.stroke();
    };
    diag('#fff', h * 0.3); diag('#d0243a', h * 0.12);
    cross('#fff', h * 0.34); cross('#d0243a', h * 0.2);
    ctx.restore();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
    ctx.strokeRect(x, y, w, h);
  }

  // Square sail bellied toward the bow (+x); used by the enemy ships.
  function squareSail(ctx, cx, top, w, h, puff) {
    ctx.fillStyle = '#fbf7ee';
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, top);
    ctx.lineTo(cx + w / 2, top);
    ctx.quadraticCurveTo(cx + w / 2 + 6 + puff, top + h / 2, cx + w / 2, top + h);
    ctx.lineTo(cx - w / 2, top + h);
    ctx.quadraticCurveTo(cx - w / 2 + 6 + puff, top + h / 2, cx - w / 2, top);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  // Spanish Cross of Burgundy: ragged red saltire.
  function burgundyCross(ctx, x, y, w, h, lw) {
    ctx.strokeStyle = '#c8202e'; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.15, y + h * 0.15); ctx.lineTo(x + w * 0.85, y + h * 0.85);
    ctx.moveTo(x + w * 0.85, y + h * 0.15); ctx.lineTo(x + w * 0.15, y + h * 0.85);
    ctx.stroke();
    ctx.fillStyle = '#c8202e';   // the "ragged" knots along each branch
    for (const f of [0.3, 0.7]) {
      for (const [px, py] of [[f, f], [1 - f, f]]) {
        ctx.beginPath(); ctx.arc(x + w * px, y + h * py, lw * 0.75, 0, TAU); ctx.fill();
      }
    }
  }

  // British navy frigate facing left. `sink` runs 0→1 as it goes down;
  // `charge` 0→1 lights the bow gun just before it fires.
  function frigate(ctx, x, y, t, sink, charge) {
    ctx.save();
    ctx.translate(x, y + sink * 60);
    ctx.rotate(sink ? -sink * 0.7 : Math.sin(t * 2) * 0.04);
    ctx.globalAlpha = sink > 0.7 ? Math.max(0, (1 - sink) / 0.3) : 1;
    ctx.scale(-1, 1);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = 3;

    box(ctx, -19, -76, 5, 68, '#5a3a1f', 2);
    box(ctx, 13, -66, 5, 58, '#5a3a1f', 2);
    unionJack(ctx, -39, -76, 20, 12);

    const puff = Math.sin(t * 3) * 1.5;
    const sail = (cx, top, w, h) => squareSail(ctx, cx, top, w, h, puff);
    sail(-16, -68, 30, 20);
    sail(-16, -44, 36, 26);
    sail(15, -60, 26, 18);
    sail(15, -39, 30, 22);
    // Red St George's cross on the big mainsail.
    ctx.strokeStyle = '#d0243a'; ctx.lineWidth = 4; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(-13, -44); ctx.lineTo(-13, -18); ctx.moveTo(-33, -31); ctx.lineTo(4, -31); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';

    const hull = () => {
      ctx.beginPath();
      ctx.moveTo(-50, -22);
      ctx.lineTo(-30, -22);
      ctx.lineTo(-28, -10);
      ctx.lineTo(38, -10);
      ctx.quadraticCurveTo(47, -11, 54, -19);
      ctx.quadraticCurveTo(48, 16, 6, 20);
      ctx.quadraticCurveTo(-38, 20, -50, -22);
      ctx.closePath();
    };
    ctx.save();
    hull(); ctx.fillStyle = '#243a6b'; ctx.fill(); ctx.clip();
    ctx.fillStyle = '#f2c230'; ctx.fillRect(-60, -4, 120, 7);
    ctx.fillStyle = INK;
    for (let gx = -34; gx <= 30; gx += 13) { ctx.beginPath(); rr(ctx, gx, -3, 6, 5, 1); ctx.fill(); }
    ctx.restore();
    hull(); ctx.stroke();

    if (charge > 0) {
      ctx.fillStyle = `rgba(255,176,58,${0.4 + charge * 0.6})`;
      ctx.beginPath(); ctx.arc(54, -12, 3 + charge * 7, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,250,210,${charge})`;
      ctx.beginPath(); ctx.arc(54, -12, 2 + charge * 3, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // Spanish treasure galleon facing left: tall, tubby, red and gold, three masts.
  function galleon(ctx, x, y, t, sink, charge) {
    ctx.save();
    ctx.translate(x, y + sink * 70);
    ctx.rotate(sink ? sink * 0.6 : Math.sin(t * 1.6) * 0.03);
    ctx.globalAlpha = sink > 0.7 ? Math.max(0, (1 - sink) / 0.3) : 1;
    ctx.scale(-1, 1);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = 3;

    box(ctx, -37, -84, 5, 60, '#5a3a1f', 2);
    box(ctx, -7, -104, 6, 82, '#5a3a1f', 2);
    box(ctx, 26, -88, 5, 70, '#5a3a1f', 2);

    const flutter = Math.sin(t * 9) * 1.5;
    ctx.fillStyle = '#fbf7ee';
    ctx.beginPath(); ctx.rect(-31, -104 + flutter * 0.3, 24, 15); ctx.fill(); ctx.stroke();
    burgundyCross(ctx, -31, -104 + flutter * 0.3, 24, 15, 2.2);
    ctx.strokeStyle = INK; ctx.lineWidth = 3;

    const puff = Math.sin(t * 2.6) * 1.5;
    const sail = (cx, top, w, h) => squareSail(ctx, cx, top, w, h, puff);
    sail(-4, -96, 36, 24);
    sail(-4, -68, 44, 32);
    sail(28, -80, 28, 20);
    sail(28, -56, 32, 24);
    sail(-34, -76, 24, 22);
    burgundyCross(ctx, -24, -66, 36, 28, 4);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';

    const hull = () => {
      ctx.beginPath();
      ctx.moveTo(-64, -44);
      ctx.lineTo(-38, -44);
      ctx.lineTo(-36, -24);
      ctx.lineTo(34, -18);
      ctx.quadraticCurveTo(47, -20, 58, -32);
      ctx.quadraticCurveTo(56, 18, 8, 24);
      ctx.quadraticCurveTo(-48, 24, -64, -44);
      ctx.closePath();
    };
    ctx.save();
    hull(); ctx.fillStyle = '#b8322a'; ctx.fill(); ctx.clip();
    ctx.fillStyle = '#7a4a24'; ctx.fillRect(-70, 6, 140, 24);
    ctx.fillStyle = '#e8b23a'; ctx.fillRect(-70, -14, 140, 6); ctx.fillRect(-70, 3, 140, 4);
    ctx.fillStyle = INK;
    for (let gx = -40; gx <= 32; gx += 13) { ctx.beginPath(); rr(ctx, gx, -5, 6, 6, 1); ctx.fill(); }
    ctx.fillStyle = '#ffd86b';   // lit stern-castle windows
    for (const wx of [-58, -50]) { ctx.beginPath(); rr(ctx, wx, -38, 5, 7, 1); ctx.fill(); }
    ctx.restore();
    hull(); ctx.stroke();

    // Gilded beakhead.
    ctx.fillStyle = '#e8b23a';
    ctx.beginPath(); ctx.moveTo(56, -30); ctx.lineTo(70, -34); ctx.lineTo(58, -22); ctx.closePath(); ctx.fill(); ctx.stroke();

    if (charge > 0) {
      ctx.fillStyle = `rgba(255,176,58,${0.4 + charge * 0.6})`;
      ctx.beginPath(); ctx.arc(58, -8, 4 + charge * 9, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,250,210,${charge})`;
      ctx.beginPath(); ctx.arc(58, -8, 2 + charge * 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // Health pips over a damaged enemy.
  function pips(ctx, x, y, hp, max) {
    for (let i = 0; i < max; i++) {
      const px = x + (i - (max - 1) / 2) * 16;
      ctx.fillStyle = i < hp ? '#ffd34e' : 'rgba(28,21,18,0.5)';
      ctx.strokeStyle = INK; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, y, 5, 0, TAU); ctx.fill(); ctx.stroke();
    }
  }

  // Comic-book starburst, optionally with a word in it ("KABOOM!").
  function burst(ctx, x, y, r, word, spin = 0) {
    const pts = 12;
    const star = (rad, fill) => {
      ctx.fillStyle = fill;
      ctx.beginPath();
      for (let i = 0; i < pts * 2; i++) {
        const a = spin + (i * Math.PI) / pts;
        const k = i % 2 ? rad * 0.62 : rad;
        ctx.lineTo(x + Math.cos(a) * k, y + Math.sin(a) * k * 0.8);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    };
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    star(r, '#ff8a2a');
    star(r * 0.72, '#ffe14d');
    if (word) text(ctx, word, x, y + 1, Math.round(r * 0.42), '#fff');
  }

  // Seagull: a flapping "m" of two arcs.
  function gull(ctx, x, y, t, s = 1) {
    const flap = Math.sin(t) * 5 * s;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const [col, lw] of [[INK, 4.5 * s], ['#ffffff', 2 * s]]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(x - 11 * s, y + flap);
      ctx.quadraticCurveTo(x - 5 * s, y - 7 * s - flap * 0.3, x, y);
      ctx.quadraticCurveTo(x + 5 * s, y - 7 * s - flap * 0.3, x + 11 * s, y + flap);
      ctx.stroke();
    }
  }

  // Tiny ship silhouette far out on the horizon.
  function distantSail(ctx, x, y, s) {
    ctx.fillStyle = 'rgba(40,70,110,0.45)';
    ctx.beginPath();
    ctx.moveTo(x - 14 * s, y); ctx.lineTo(x + 14 * s, y); ctx.lineTo(x + 10 * s, y + 5 * s); ctx.lineTo(x - 10 * s, y + 5 * s);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - 2 * s, y - 2 * s); ctx.lineTo(x - 2 * s, y - 22 * s); ctx.lineTo(x + 9 * s, y - 4 * s); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - 4 * s, y - 2 * s); ctx.lineTo(x - 4 * s, y - 16 * s); ctx.lineTo(x - 12 * s, y - 3 * s); ctx.closePath(); ctx.fill();
  }

  // Parchment scroll panel for the game-over screen.
  function panel(ctx, x, y, w, h) {
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    for (const side of [-1, 1]) {
      const cx = side < 0 ? x : x + w;
      ctx.fillStyle = '#d9b77a';
      ctx.beginPath(); rr(ctx, cx - 10, y - 8, 20, h + 16, 10); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#f5e2b5';
    ctx.beginPath(); rr(ctx, x, y, w, h, 6); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#d7b87e'; ctx.lineWidth = 2;
    ctx.beginPath(); rr(ctx, x + 10, y + 10, w - 20, h - 20, 4); ctx.stroke();
  }

  // Plain filled text in ink, for writing on parchment.
  function label(ctx, str, x, y, size, fill = INK, align = 'center') {
    ctx.font = `900 ${size}px "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  // Red ribbon banner ("NEW BEST!").
  function ribbon(ctx, x, y, w, word, tilt) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(tilt);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.fillStyle = '#9e1f1f';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * w / 2, -10); ctx.lineTo(side * (w / 2 + 22), -10); ctx.lineTo(side * (w / 2 + 14), 2);
      ctx.lineTo(side * (w / 2 + 22), 14); ctx.lineTo(side * w / 2, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#d63a2f';
    ctx.beginPath(); rr(ctx, -w / 2, -16, w, 28, 3); ctx.fill(); ctx.stroke();
    text(ctx, word, 0, -1, 18, '#ffe14d');
    ctx.restore();
  }

  function pauseButton(ctx, x, y, r, paused) {
    ctx.fillStyle = 'rgba(28,21,18,0.35)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    if (paused) {
      ctx.beginPath(); ctx.moveTo(x - r * 0.3, y - r * 0.45); ctx.lineTo(x + r * 0.5, y); ctx.lineTo(x - r * 0.3, y + r * 0.45);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      for (const dx of [-0.35, 0.12]) { ctx.beginPath(); rr(ctx, x + dx * r, y - r * 0.45, r * 0.23, r * 0.9, 2); ctx.fill(); ctx.stroke(); }
    }
  }

  // British man-o'-war boss: three gun decks, three masts, facing left.
  // `broadside` 0→1 lights every gun port before the wall of shot.
  function manOWar(ctx, x, y, t, sink, charge, broadside) {
    ctx.save();
    ctx.translate(x, y + sink * 90);
    ctx.rotate(sink ? -sink * 0.5 : Math.sin(t * 1.3) * 0.025);
    ctx.globalAlpha = sink > 0.75 ? Math.max(0, (1 - sink) / 0.25) : 1;
    ctx.scale(-1.4, 1.4);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;

    box(ctx, -32, -86, 4, 64, '#4a2f18', 2);
    box(ctx, 0, -98, 5, 76, '#4a2f18', 2);
    box(ctx, 30, -82, 4, 60, '#4a2f18', 2);

    // Long red commissioning pennant and a big Union Jack.
    const w = Math.sin(t * 8) * 2;
    ctx.fillStyle = '#d0243a';
    ctx.beginPath();
    ctx.moveTo(2, -98); ctx.quadraticCurveTo(-20, -103 + w, -44, -99 + w * 1.6); ctx.lineTo(2, -94);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    unionJack(ctx, -26, -92, 24, 14);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;

    const puff = Math.sin(t * 2.4) * 1.2;
    const sail = (cx, top, sw, sh) => squareSail(ctx, cx, top, sw, sh, puff);
    sail(-30, -80, 24, 16); sail(-30, -60, 28, 20);
    sail(2, -76, 30, 18);   sail(2, -54, 36, 26);
    sail(32, -76, 24, 16);  sail(32, -56, 30, 22);
    ctx.strokeStyle = '#d0243a'; ctx.lineWidth = 3.5; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(4, -54); ctx.lineTo(4, -28); ctx.moveTo(-15, -41); ctx.lineTo(24, -41); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineCap = 'round';

    const hull = () => {
      ctx.beginPath();
      ctx.moveTo(-68, -32);
      ctx.lineTo(-46, -32);
      ctx.lineTo(-44, -24);
      ctx.lineTo(44, -20);
      ctx.quadraticCurveTo(56, -22, 64, -32);
      ctx.quadraticCurveTo(60, 20, 10, 26);
      ctx.quadraticCurveTo(-52, 26, -68, -32);
      ctx.closePath();
    };
    const decks = [-15, -3, 9];
    ctx.save();
    hull(); ctx.fillStyle = '#1f2530'; ctx.fill(); ctx.clip();
    ctx.fillStyle = '#f2c230';
    for (const dy of decks) ctx.fillRect(-80, dy, 160, 5);
    ctx.fillStyle = INK;
    for (const dy of decks) for (let gx = -52; gx <= 46; gx += 11) { ctx.beginPath(); rr(ctx, gx, dy + 0.5, 5, 4, 1); ctx.fill(); }
    if (broadside > 0) {
      ctx.fillStyle = `rgba(255,170,50,${broadside})`;
      for (const dy of decks) for (let gx = -52; gx <= 46; gx += 11) {
        ctx.beginPath(); ctx.arc(gx + 2.5, dy + 2.5, 2 + broadside * 3, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
    hull(); ctx.stroke();
    ctx.fillStyle = '#f2c230';
    ctx.beginPath(); ctx.moveTo(62, -30); ctx.lineTo(74, -35); ctx.lineTo(64, -22); ctx.closePath(); ctx.fill(); ctx.stroke();

    if (charge > 0) {
      ctx.fillStyle = `rgba(255,176,58,${0.4 + charge * 0.6})`;
      ctx.beginPath(); ctx.arc(64, -12, 3 + charge * 7, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function bossBar(ctx, x, y, w, frac, name) {
    text(ctx, name, x, y - 15, 15, '#ffd34e');
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(28,21,18,0.55)';
    ctx.beginPath(); rr(ctx, x - w / 2, y - 6, w, 12, 6); ctx.fill();
    ctx.fillStyle = '#d63a2f';
    ctx.beginPath(); rr(ctx, x - w / 2, y - 6, Math.max(12, w * frac), 12, 6); ctx.fill();
    ctx.beginPath(); rr(ctx, x - w / 2, y - 6, w, 12, 6); ctx.stroke();
  }

  function sparkle(ctx, x, y, r, t) {
    ctx.strokeStyle = `rgba(255,248,200,${0.5 + Math.sin(t * 6) * 0.5})`;
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
  }

  // Floating treasure chest, lid cracked open on a glint of gold.
  function chest(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y + Math.sin(t * 3) * 3);
    ctx.rotate(Math.sin(t * 2) * 0.08);
    const glow = ctx.createRadialGradient(0, -4, 2, 0, -4, 30);
    glow.addColorStop(0, 'rgba(255,225,77,0.55)'); glow.addColorStop(1, 'rgba(255,225,77,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, -4, 30, 0, TAU); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.fillStyle = '#ffd34e';
    for (const cx of [-7, 0, 7]) { ctx.beginPath(); ctx.arc(cx, -9, 4, 0, TAU); ctx.fill(); ctx.stroke(); }
    box(ctx, -15, -5, 30, 17, '#9a5a2a', 2);
    ctx.fillStyle = '#b06a32';
    ctx.beginPath();
    ctx.moveTo(-15, -6); ctx.lineTo(-15, -12); ctx.quadraticCurveTo(0, -24, 15, -14); ctx.lineTo(15, -8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2c230';
    for (const bx of [-10, 7]) { ctx.beginPath(); ctx.rect(bx, -5, 3, 17); ctx.fill(); ctx.stroke(); }
    box(ctx, -3, -7, 6, 7, '#f2c230', 1);
    ctx.restore();
    sparkle(ctx, x + 14, y - 16, 5, t);
    sparkle(ctx, x - 16, y - 2, 3.5, t + 1.3);
  }

  // Rum barrel: grab it for rapid fire.
  function barrel(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y + Math.sin(t * 3 + 1) * 3);
    ctx.rotate(Math.sin(t * 2.3) * 0.12);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.fillStyle = '#a0612e';
    ctx.beginPath();
    ctx.moveTo(-10, -15); ctx.quadraticCurveTo(-16, 0, -10, 15); ctx.lineTo(10, 15);
    ctx.quadraticCurveTo(16, 0, 10, -15); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#4b4b55'; ctx.lineWidth = 3;
    for (const by of [-9, 9]) { ctx.beginPath(); ctx.moveTo(-13, by); ctx.lineTo(13, by); ctx.stroke(); }
    ctx.restore();
    text(ctx, 'XXX', x, y + Math.sin(t * 3 + 1) * 3, 9, '#fff');
  }

  function cannonball(ctx, x, y, r = 6) {
    ctx.fillStyle = '#26262b'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6a6a74';
    ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.3, 0, TAU); ctx.fill();
  }

  // Round fire button with a reload ring; `ready` runs 0→1.
  function fireButton(ctx, x, y, r, ready, label) {
    ctx.fillStyle = 'rgba(28,21,18,0.35)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = ready >= 1 ? '#ffd34e' : 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y, r - 3, -Math.PI / 2, -Math.PI / 2 + TAU * ready); ctx.stroke();
    ctx.globalAlpha = ready >= 1 ? 1 : 0.55;
    cannonball(ctx, x, y - 5, r * 0.3);
    text(ctx, label, x, y + r * 0.45, 11);
    ctx.globalAlpha = 1;
  }

  // Distant island with a fort, like the one in the logo. `y` is the horizon.
  function island(ctx, x, y) {
    ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    blob(ctx, [
      { x: x - 60, y: y - 14, w: 130, h: 16, r: 8 },
      { x: x - 30, y: y - 20, r: 18 }, { x: x + 20, y: y - 18, r: 20 },
    ], '#4fae4a', 3);
    ctx.fillStyle = '#8a8378';
    ctx.beginPath(); ctx.moveTo(x - 64, y); ctx.lineTo(x - 50, y - 12); ctx.lineTo(x + 60, y - 12); ctx.lineTo(x + 74, y); ctx.closePath();
    ctx.lineWidth = 3; ctx.fill(); ctx.stroke();

    ctx.lineWidth = 2.5;
    box(ctx, x - 12, y - 58, 26, 42, '#a39c8f', 1);
    for (let i = 0; i < 3; i++) box(ctx, x - 13 + i * 10, y - 64, 7, 7, '#a39c8f', 1);
    ctx.fillStyle = INK;
    ctx.beginPath(); rr(ctx, x - 1, y - 46, 5, 8, 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 10, y - 64); ctx.lineTo(x + 10, y - 82); ctx.stroke();
    ctx.fillStyle = '#e0392d';
    ctx.beginPath(); ctx.moveTo(x + 10, y - 82); ctx.lineTo(x + 24, y - 78); ctx.lineTo(x + 10, y - 73); ctx.closePath(); ctx.fill(); ctx.stroke();

    for (const [px, lean] of [[x - 40, -1], [x + 44, 1]]) {
      ctx.strokeStyle = INK; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(px, y - 14); ctx.quadraticCurveTo(px + lean * 4, y - 30, px + lean * 8, y - 42); ctx.stroke();
      ctx.strokeStyle = '#8a6236'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(px, y - 14); ctx.quadraticCurveTo(px + lean * 4, y - 30, px + lean * 8, y - 42); ctx.stroke();
      const tx = px + lean * 8, ty = y - 42;
      const leaves = [];
      for (let i = 0; i < 5; i++) {
        const a = Math.PI + (i / 4) * Math.PI;
        leaves.push({ x: tx + Math.cos(a) * 9, y: ty + Math.sin(a) * 5 + 3, r: 5 });
      }
      blob(ctx, leaves, '#3f9a45', 3);
    }
  }

  function cloud(ctx, x, y, s) {
    blob(ctx, [
      { x: x, y: y, r: 18 * s }, { x: x + 22 * s, y: y - 10 * s, r: 22 * s },
      { x: x + 46 * s, y: y, r: 17 * s }, { x: x - 4 * s, y: y - 6 * s, w: 54 * s, h: 20 * s, r: 10 * s },
    ], '#ffffff', 4);
  }

  // Big outlined title text.
  function text(ctx, str, x, y, size, fill = '#fff', align = 'center') {
    ctx.font = `900 ${size}px "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, size / 6);
    ctx.strokeStyle = INK;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  return { INK, blob, ship, frigate, galleon, manOWar, bossBar, chest, barrel, pips, burst, gull, distantSail, panel, label, ribbon, pauseButton, cannonball, fireButton, sandbar, stormCloud, makeObstacle, island, cloud, text, rr };
})();

// Goofy sound effects synthesized with Web Audio, so there are no audio files to ship.
window.Sfx = (() => {
  'use strict';
  let ac = null;
  let muted = false;

  function audio() {
    if (!ac) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      ac = new A();
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function tone(f1, f2, dur, type, vol, delay = 0) {
    const a = audio();
    if (!a || muted) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + dur);
  }

  function noise(dur, vol, cutoff, delay = 0) {
    const a = audio();
    if (!a || muted) return;
    const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const src = a.createBufferSource();
    const lp = a.createBiquadFilter();
    const g = a.createGain();
    src.buffer = buf;
    lp.type = 'lowpass';
    lp.frequency.value = cutoff;
    g.gain.value = vol;
    src.connect(lp).connect(g).connect(a.destination);
    src.start(a.currentTime + delay);
  }

  return {
    unlock: audio,
    toggleMute() { muted = !muted; return muted; },
    get muted() { return muted; },
    flap() { tone(280, 520, 0.12, 'triangle', 0.14); noise(0.08, 0.08, 2500); },
    point() { tone(880, 880, 0.07, 'square', 0.05); tone(1320, 1320, 0.1, 'square', 0.05, 0.07); },
    cannon() { noise(0.35, 0.5, 700); tone(120, 40, 0.3, 'sine', 0.35); },
    enemyCannon() { noise(0.3, 0.3, 450); tone(90, 35, 0.3, 'sine', 0.22); },
    thud() { noise(0.2, 0.35, 900); tone(160, 70, 0.18, 'square', 0.07); },
    coin() { tone(988, 988, 0.08, 'square', 0.05); tone(1319, 1319, 0.25, 'square', 0.05, 0.08); },
    pause() { tone(660, 440, 0.12, 'triangle', 0.08); },
    thunder() { noise(1.4, 0.5, 260); noise(0.35, 0.3, 1400); },
    horn() { tone(110, 104, 0.9, 'sawtooth', 0.1); tone(82, 80, 1.1, 'sawtooth', 0.08, 0.1); },
    rum() { tone(220, 520, 0.2, 'triangle', 0.12); tone(330, 780, 0.2, 'triangle', 0.1, 0.12); },
    fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.22, 'square', 0.06, i * 0.13)); },
    poof() { noise(0.12, 0.15, 1600); },
    sink() { noise(0.4, 0.4, 1100); tone(300, 60, 0.5, 'sawtooth', 0.1); noise(0.7, 0.25, 2600, 0.25); },
    crash() { noise(0.45, 0.45, 900); tone(170, 45, 0.45, 'sawtooth', 0.18); },
  };
})();

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

  const game = {
    state: 'menu',               // menu → playing → dead → playing …
    t: 0,
    scroll: 0,
    score: 0,
    best: loadBest(),
    ship: { y: H * 0.45, vy: 0, tilt: 0, stretch: 0 },
    reefs: [],
    balls: [],                   // player cannonballs
    shots: [],                   // enemy cannonballs
    enemies: [],
    popups: [],                  // floating "+5" text and KABOOM bursts
    flashes: [],                 // muzzle flashes
    particles: [],
    gulls: [],
    sails: [{ x: 520, s: 0.8 }, { x: 110, s: 0.6 }],   // distant ships on the horizon
    sunk: { frigate: 0, galleon: 0 },
    storm: { on: false, k: 0, gust: 0, gustTarget: 0, gustT: 0, flash: 0, nextBolt: 0 },
    boss: null,
    banner: null,                // big centre-screen announcement
    nextStorm: STORM_AT,
    nextBoss: BOSS_AT,
    bossesBeaten: 0,
    treasure: 0,
    rapid: 0,                    // seconds of rum-fuelled rapid fire left
    clouds: [
      { x: 80, y: 42, s: 0.9 }, { x: 330, y: 64, s: 0.7 },
      { x: 560, y: 36, s: 1.0 }, { x: 760, y: 70, s: 0.6 },
    ],
    untilReef: 0,
    untilEnemy: 0,
    passed: 0,                   // reefs passed; drives difficulty
    reload: 0,
    lastGapY: H * 0.45,
    deadT: 0,
    shake: 0,
    freeze: 0,                   // hit-stop after a sinking
    paused: false,
    scorePop: 0,
    newBest: false,
    untilGull: 2,
    wakeT: 0,
  };

  // ---------- persistence ----------

  function loadBest() {
    try { return parseInt(localStorage.getItem('reefrunner.best'), 10) || 0; } catch { return 0; }
  }
  function saveBest(n) {
    try { localStorage.setItem('reefrunner.best', String(n)); } catch { /* private mode etc. */ }
  }

  // ---------- difficulty ----------

  // Difficulty climbs with reefs passed rather than score, so sinking ships
  // earns points without also speeding up the sea.
  const speed = () => Math.min(290, 170 + game.passed * 3);
  const gapSize = () => Math.max(135, 190 - game.passed * 2);
  const enemyShotSpeed = () => Math.min(410, 330 + game.passed * 2);
  const maxEnemies = () => (game.passed >= 25 ? 2 : 1);
  const enemyInterval = () => rnd(5, 9) - Math.min(3, game.passed * 0.06);
  const galleonChance = () => (game.passed < 12 ? 0 : Math.min(0.5, 0.25 + (game.passed - 12) * 0.02));

  // ---------- game flow ----------

  function reset() {
    const s = game.ship;
    s.y = H * 0.45; s.vy = 0; s.tilt = 0; s.stretch = 0;
    game.reefs = [];
    game.balls = [];
    game.shots = [];
    game.enemies = [];
    game.popups = [];
    game.flashes = [];
    game.sunk = { frigate: 0, galleon: 0 };
    game.storm = { on: false, k: 0, gust: 0, gustTarget: 0, gustT: 0, flash: 0, nextBolt: 0 };
    game.boss = null;
    game.banner = null;
    game.nextStorm = STORM_AT;
    game.nextBoss = BOSS_AT;
    game.bossesBeaten = 0;
    game.treasure = 0;
    game.rapid = 0;
    game.newBest = false;
    game.reload = 0;
    game.untilEnemy = 6;
    game.passed = 0;
    game.score = 0;
    game.untilReef = 120;
    game.lastGapY = H * 0.45;
    game.deadT = 0;
  }

  function flap() {
    Sfx.unlock();
    if (game.state === 'menu') {
      reset();
      game.state = 'playing';
    } else if (game.state === 'dead') {
      if (game.deadT < 0.7) return;   // don't let a panicked tap skip the game-over screen
      reset();
      game.state = 'playing';
    }
    const s = game.ship;
    s.vy = FLAP_VY;
    s.stretch = 1;
    Sfx.flap();
    for (let i = 0; i < 6; i++) {
      spawnParticle(SHIP_X - 10 + Math.random() * 20, s.y + 16,
        -60 - Math.random() * 120, 40 + Math.random() * 120,
        3 + Math.random() * 3, 0.45, Math.random() < 0.5 ? '#ffffff' : '#bdf0f5');
    }
  }

  function wreck(cause) {
    if (GOD) { game.hits = game.hits || {}; game.hits[cause] = (game.hits[cause] || 0) + 1; return; }
    game.state = 'dead';
    game.deadT = 0;
    game.shake = 14;
    game.ship.vy = -320;
    Sfx.crash();
    const colors = ['#9a5a32', '#7a4a2a', '#f7ecd2', '#f2c14e'];
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 120 + Math.random() * 260;
      spawnParticle(SHIP_X, game.ship.y - 10, Math.cos(a) * v, Math.sin(a) * v - 120,
        3 + Math.random() * 4, 1.1, colors[i % colors.length], 900);
    }
    if (game.score > game.best) {
      game.best = game.score;
      game.newBest = true;
      saveBest(game.best);
      setTimeout(() => {
        Sfx.coin();
        for (let i = 0; i < 30; i++) {
          spawnParticle(W / 2 + rnd(-120, 120), 120, rnd(-160, 160), rnd(-380, -120), rnd(4, 6), 1.6,
            i % 3 ? '#ffd34e' : '#f2a62a', 700);
        }
      }, 450);
    }
  }

  function spawnReef() {
    const gap = gapSize();
    const lo = 50 + gap / 2;
    const hi = FLOOR - 40 - gap / 2;
    // Keep consecutive gaps within reach so no layout is impossible.
    const minY = Math.max(lo, game.lastGapY - 160);
    const maxY = Math.min(hi, game.lastGapY + 160);
    const gapY = minY + Math.random() * (maxY - minY);
    game.lastGapY = gapY;
    const roll = Math.random();
    const pickup = game.passed >= 3 && roll < 0.16 ? 'chest' : game.passed >= 6 && roll < 0.22 ? 'rum' : null;
    game.reefs.push({
      x: W + 20,
      top: gapY - gap / 2,        // bottom edge of the storm cloud
      bottom: gapY + gap / 2,     // top edge of the sandbar
      passed: false,
      look: Art.makeObstacle(),
      pickup: pickup && { kind: pickup, y: Math.max(CEILING + 40, Math.min(FLOOR - 40, gapY + rnd(-70, 70))), taken: false },
    });
  }

  function spawnParticle(x, y, vx, vy, r, life, color, gravity = 500) {
    game.particles.push({ x, y, vx, vy, r, life, max: life, color, gravity });
  }

  const rnd = (a, b) => a + Math.random() * (b - a);

  function smoke(x, y, n, drift = 0) {
    for (let i = 0; i < n; i++) {
      spawnParticle(x + rnd(-4, 4), y + rnd(-4, 4), drift + rnd(-40, 40), rnd(-50, 10),
        rnd(5, 10), rnd(0.4, 0.7), Math.random() < 0.5 ? '#f2f2f2' : '#c9ccd4', -40);
    }
  }

  function puffSand(x, y) {
    for (let i = 0; i < 7; i++) {
      spawnParticle(x, y, rnd(-90, 60), rnd(-200, -60), rnd(2.5, 4.5), 0.6, i % 2 ? '#f2cf82' : '#d9ad5e', 700);
    }
  }

  // A point on the player ship, given in unscaled ship space.
  function shipPoint(hx, hy) {
    const s = game.ship;
    const c = Math.cos(s.tilt), n = Math.sin(s.tilt);
    return { x: SHIP_X + (hx * c - hy * n) * SHIP_SCALE, y: s.y + (hx * n + hy * c) * SHIP_SCALE };
  }

  function fire() {
    Sfx.unlock();
    if (game.state !== 'playing' || game.reload > 0) return;
    game.reload = game.rapid > 0 ? RAPID_COOLDOWN : FIRE_COOLDOWN;
    const m = shipPoint(50, -18);
    const aim = Math.sin(game.ship.tilt);
    game.balls.push({ x: m.x, y: m.y, vx: BALL_SPEED, vy: aim * BALL_SPEED * 0.4, g: 60 });
    smoke(m.x, m.y, 5, 60);
    game.flashes.push({ x: m.x + 6, y: m.y, r: 12, life: 0.09 });
    game.shake = Math.max(game.shake, 3);
    Sfx.cannon();
  }

  const clampSea = y => Math.max(CEILING + 70, Math.min(FLOOR - 30, y));

  function spawnEnemy() {
    const kind = Math.random() < galleonChance() ? 'galleon' : 'frigate';
    const T = ENEMIES[kind];
    const other = game.enemies.find(e => e.state !== 'sinking');
    let station = T.station;
    let fireT = 1.2;
    if (other) {
      // Share the sea: take the other slot and fire out of step with the first ship.
      station = other.station >= 640 ? other.station - 160 : other.station + 150;
      fireT = Math.max(1.2, other.fireT + 1);
    }
    game.enemies.push({
      kind, T, station, fireT, hp: T.hp,
      x: W + 90, y: clampSea(game.ship.y), t: 0, state: 'enter', sink: 0, flash: 0,
    });
  }

  function splinter(e, n, speed) {
    const cols = e.T.splinters;
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), v = rnd(speed * 0.35, speed);
      spawnParticle(e.x, e.y - 20, Math.cos(a) * v, Math.sin(a) * v - 140, rnd(3, 6), 1.1, cols[i % cols.length], 900);
    }
  }

  function hitEnemy(e, b) {
    e.hp--;
    e.flash = 0.2;
    if (e.hp > 0) {
      game.popups.push({ burst: true, x: b.x, y: b.y, r: 16, text: '', life: 0.25, max: 0.25, spin: rnd(0, 1) });
      splinter(e, 8, 200);
      smoke(b.x, b.y, 4);
      game.shake = Math.max(game.shake, 4);
      Sfx.thud();
      return;
    }
    e.state = 'sinking';
    game.sunk[e.kind]++;
    game.score += e.T.points;
    game.scorePop = 1;
    game.freeze = 0.07;
    game.popups.push({ burst: true, x: e.x, y: e.y - 40, r: 46, text: 'KABOOM!', life: 0.7, max: 0.7, spin: rnd(0, 1) });
    game.popups.push({ x: e.x, y: e.y - e.T.box.top - 34, text: `+${e.T.points}`, life: 1.2 });
    game.shake = Math.max(game.shake, e.kind === 'galleon' ? 12 : 8);
    Sfx.sink();
    splinter(e, e.kind === 'galleon' ? 36 : 24, 300);
    smoke(e.x, e.y - 30, 10);
  }

  // A fan of shots from (mx, my), aimed straight at where the ship is now,
  // so keeping on the move dodges it.
  function volley(mx, my, spread, r) {
    const speed = enemyShotSpeed();
    const time = (mx - SHIP_X) / speed;
    const aim = Math.max(-160, Math.min(160, (game.ship.y - 10 - my) / time));
    for (const fan of spread) game.shots.push({ x: mx, y: my, vx: -speed, vy: aim + fan, g: 0, r });
    smoke(mx, my, 4 + 2 * spread.length, -60);
    game.flashes.push({ x: mx - 6, y: my, r: 14, life: 0.09 });
    Sfx.enemyCannon();
  }

  function enemyVolley(e) {
    volley(e.x + e.T.muzzle[0], e.y + e.T.muzzle[1], e.T.spread, e.kind === 'galleon' ? 7 : 6);
  }

  // ---------- events: treasure, storms, the man-o'-war ----------

  function announce(title, sub) {
    game.banner = { title, sub, life: 2.6, max: 2.6 };
  }

  function onReefPassed() {
    const pts = game.storm.on ? 2 : 1;    // storms pay double
    game.score += pts;
    game.passed++;
    game.scorePop = 1;
    Sfx.point();
    if (!game.storm.on && game.passed === game.nextStorm) {
      game.storm.on = true;
      game.storm.nextBolt = 1.2;
      announce('STORM!', 'Wind gusts  ·  double points');
      Sfx.thunder();
    } else if (game.storm.on && game.passed >= game.nextStorm + STORM_LEN) {
      game.storm.on = false;
      game.nextStorm += EVENT_CYCLE;
      announce('Calm seas', '');
    }
    if (game.passed === game.nextBoss && !game.boss) startBoss();
  }

  function collect(p, x) {
    p.taken = true;
    if (p.kind === 'chest') {
      game.score += CHEST_POINTS;
      game.treasure++;
      game.scorePop = 1;
      game.popups.push({ x, y: p.y - 30, text: `+${CHEST_POINTS}`, life: 1 });
      Sfx.coin();
      for (let i = 0; i < 14; i++) {
        spawnParticle(x, p.y, rnd(-140, 140), rnd(-260, -80), rnd(3, 5), 0.9, i % 2 ? '#ffd34e' : '#f2a62a', 700);
      }
    } else {
      game.rapid = RAPID_TIME;
      game.reload = 0;
      game.popups.push({ x, y: p.y - 30, text: 'RAPID FIRE!', life: 1.2 });
      Sfx.rum();
    }
  }

  function updateStorm(dt) {
    const st = game.storm;
    st.k += ((st.on ? 1 : 0) - st.k) * Math.min(1, dt * 0.8);
    st.flash = Math.max(0, st.flash - dt * 4);
    if (st.k < 0.02) return;
    st.gustT -= dt;
    if (st.gustT <= 0) { st.gustTarget = st.on ? rnd(-260, 200) : 0; st.gustT = rnd(1.2, 2.4); }
    st.gust += (st.gustTarget - st.gust) * Math.min(1, dt * 2);
    game.ship.vy += st.gust * st.k * dt;        // negative gusts lift, positive ones push down
    st.nextBolt -= dt;
    if (st.on && st.nextBolt <= 0) {
      st.flash = 1;
      st.nextBolt = rnd(2.5, 5.5);
      game.shake = Math.max(game.shake, 5);
      Sfx.thunder();
    }
  }

  function startBoss() {
    const hp = 12 + game.bossesBeaten * 6;
    game.boss = {
      x: W + 170, y: 260, hp, maxHp: hp, t: 0, state: 'enter',
      attackT: 1.5, attacks: 0, wall: 0, sink: 0, flash: 0, burstT: 0,
    };
    for (const e of game.enemies) if (e.state !== 'sinking') e.state = 'leave';
    announce("HMS INVINCIBLE", "A man-o'-war blocks the way!");
    Sfx.horn();
  }

  // A wall of shot down the whole sea with one gap near the player to slip through.
  function broadside(b) {
    const gapY = Math.max(CEILING + 70, Math.min(FLOOR - 70, game.ship.y + rnd(-80, 80)));
    for (let y = CEILING + 12; y < FLOOR - 6; y += 30) {
      if (Math.abs(y - gapY) < 62) continue;
      game.shots.push({ x: b.x - 70 + rnd(-6, 6), y, vx: -300, vy: 0, g: 0, r: 6 });
      smoke(b.x - 70, y, 1, -60);
    }
    game.shake = Math.max(game.shake, 10);
    Sfx.cannon();
    Sfx.enemyCannon();
  }

  function hitBoss(b, ball) {
    b.hp--;
    b.flash = 0.2;
    game.popups.push({ burst: true, x: ball.x, y: ball.y, r: 18, text: '', life: 0.25, max: 0.25, spin: rnd(0, 1) });
    if (b.hp > 0) { Sfx.thud(); game.shake = Math.max(game.shake, 4); return; }
    b.state = 'sinking';
    b.wall = 0;
    game.bossesBeaten++;
    game.score += BOSS.points;
    game.scorePop = 1;
    game.freeze = 0.12;
    game.shake = 16;
    game.popups.push({ burst: true, x: b.x, y: b.y - 60, r: 64, text: 'KABOOM!', life: 0.9, max: 0.9, spin: rnd(0, 1) });
    game.popups.push({ x: b.x, y: b.y - 150, text: `+${BOSS.points}`, life: 1.6 });
    announce('VICTORY!', 'The seas are yours, captain');
    Sfx.sink();
    Sfx.fanfare();
  }

  function updateBoss(dt, v) {
    const b = game.boss;
    if (!b) return;
    b.t += dt;
    b.flash = Math.max(0, b.flash - dt);
    if (b.state === 'sinking') {
      b.sink += dt / 3;
      b.x -= v * dt * 0.3;
      b.burstT -= dt;
      if (b.sink < 0.55 && b.burstT <= 0) {
        b.burstT = 0.22;
        const bx = b.x + rnd(-80, 80), by = b.y - rnd(0, 110);
        game.popups.push({ burst: true, x: bx, y: by, r: rnd(22, 38), text: '', life: 0.4, max: 0.4, spin: rnd(0, 1) });
        for (let i = 0; i < 6; i++) spawnParticle(bx, by, rnd(-200, 200), rnd(-300, -60), rnd(3, 6), 1, i % 2 ? '#1f2530' : '#f2c230', 900);
        game.shake = Math.max(game.shake, 6);
        Sfx.thud();
      }
      if (b.sink >= 1) {
        game.boss = null;
        game.untilReef = 260;
        game.untilEnemy = 4;
        game.nextBoss += EVENT_CYCLE;
      }
      return;
    }
    b.x += (BOSS.station - b.x) * Math.min(1, dt * 0.9);
    const dy = Math.max(150, Math.min(FLOOR - 40, game.ship.y + 30)) - b.y;
    b.y += Math.sign(dy) * Math.min(Math.abs(dy), BOSS.track * dt);
    if (b.state === 'enter' && b.t > 2) b.state = 'fight';
    if (b.state !== 'fight') return;
    if (b.wall > 0) {
      b.wall -= dt;
      if (b.wall <= 0) broadside(b);
      return;
    }
    b.attackT -= dt;
    if (b.attackT <= 0) {
      b.attacks++;
      if (b.attacks % 3 === 0) b.wall = 0.9;    // every third attack: light the gun decks, then the wall
      else volley(b.x + BOSS.muzzle[0], b.y + BOSS.muzzle[1], [-110, -55, 0, 55, 110], 7);
      b.attackT = rnd(1.6, 2.2) - Math.min(0.4, game.bossesBeaten * 0.15);
    }
  }

  // Cannonballs fly straight through storm clouds but bury themselves in sandbars.
  function ballHitsSand(x, y) {
    if (y > FLOOR) return true;
    for (const r of game.reefs) {
      if (x > r.x && x < r.x + REEF_W && y > r.bottom + 4) return true;
    }
    return false;
  }

  function updateCombat(dt, v) {
    const s = game.ship;
    game.reload = Math.max(0, game.reload - dt);

    game.rapid = Math.max(0, game.rapid - dt);
    // No new warships while a storm blows or the man-o'-war is out.
    if (!game.boss && !game.storm.on && game.enemies.filter(e => e.state !== 'sinking').length < maxEnemies()) {
      game.untilEnemy -= dt;
      if (game.untilEnemy <= 0) { spawnEnemy(); game.untilEnemy = enemyInterval(); }
    }

    for (const e of game.enemies) {
      e.t += dt;
      e.flash = Math.max(0, e.flash - dt);
      if (e.state === 'sinking') {
        e.sink += dt / e.T.sinkTime;
        e.x -= v * dt * 0.6;
        if (Math.random() < dt * 20) spawnParticle(e.x + rnd(-30, 30), e.y + rnd(-10, 20), 0, -60, rnd(2, 4), 0.6, '#dff6ff', -80);
        continue;
      }
      const hold = e.state === 'leave' ? W + 160 : e.station;
      e.x += (hold - e.x) * Math.min(1, dt * 1.4);
      // Shadow the player's height, but slowly enough to be outrun.
      const dy = clampSea(s.y) - e.y;
      e.y += Math.sign(dy) * Math.min(Math.abs(dy), e.T.track * dt);

      if (e.state === 'enter' && e.t > 1.2) e.state = 'fight';
      if (e.state === 'fight') {
        e.fireT -= dt;
        if (e.fireT <= 0) {
          enemyVolley(e);
          e.fireT = rnd(...e.T.fire) - Math.min(0.5, game.passed * 0.01);
        }
        if (e.t > e.T.stay) e.state = 'leave';
      }
    }
    game.enemies = game.enemies.filter(e => e.sink < 1 && !(e.state === 'leave' && e.x > W + 140));
    updateBoss(dt, v);

    for (const b of [...game.balls, ...game.shots]) {
      b.vy += b.g * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (ballHitsSand(b.x, b.y)) { b.dead = true; puffSand(b.x, b.y); Sfx.poof(); }
    }

    for (const b of game.balls) {
      if (b.dead) continue;
      for (const e of game.enemies) {
        if (e.state === 'sinking') continue;
        const box = e.T.box;
        if (Math.abs(b.x - e.x) < box.w && b.y > e.y - box.top && b.y < e.y + box.bottom) {
          b.dead = true;
          hitEnemy(e, b);
          break;
        }
      }
      const B = game.boss;
      if (!b.dead && B && B.state !== 'sinking' && Math.abs(b.x - B.x) < BOSS.box.w &&
          b.y > B.y - BOSS.box.top && b.y < B.y + BOSS.box.bottom) {
        b.dead = true;
        hitBoss(B, b);
        continue;
      }
      // Cannonballs that meet in mid-air knock each other out.
      for (const e of game.shots) {
        if (!e.dead && (b.x - e.x) ** 2 + (b.y - e.y) ** 2 < 14 * 14) {
          b.dead = e.dead = true;
          smoke(b.x, b.y, 6);
          Sfx.poof();
        }
      }
    }

    for (const e of game.shots) {
      if (e.dead) continue;
      for (const c of shipCircles()) {
        if ((e.x - c.x) ** 2 + (e.y - c.y) ** 2 < (c.r + e.r - 1) ** 2) { e.dead = true; wreck('cannonball'); return; }
      }
    }

    const alive = b => !b.dead && b.x > -20 && b.x < W + 40 && b.y < H;
    game.balls = game.balls.filter(alive);
    game.shots = game.shots.filter(alive);
  }

  // ---------- collision ----------

  function circleHitsRect(cx, cy, r, x, y, w, h) {
    const nx = Math.max(x, Math.min(cx, x + w));
    const ny = Math.max(y, Math.min(cy, y + h));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  }

  function shipCircles() {
    const s = game.ship;
    const c = Math.cos(s.tilt), n = Math.sin(s.tilt);
    return SHIP_HITS.map(h => ({
      x: SHIP_X + (h.x * c - h.y * n) * SHIP_SCALE,
      y: s.y + (h.x * n + h.y * c) * SHIP_SCALE,
      r: h.r * SHIP_SCALE,
    }));
  }

  function shipCollides() {
    for (const c of shipCircles()) {
      if (c.y + c.r > FLOOR) return true;
      for (const r of game.reefs) {
        if (circleHitsRect(c.x, c.y, c.r, r.x, -100, REEF_W, r.top + 100)) return true;
        if (circleHitsRect(c.x, c.y, c.r, r.x, r.bottom, REEF_W, H - r.bottom + 100)) return true;
      }
    }
    return false;
  }

  // ---------- update ----------

  function update(dt) {
    if (game.freeze > 0) { game.freeze -= dt; return; }
    game.t += dt;
    const s = game.ship;
    const moving = game.state !== 'dead';
    const v = game.state === 'playing' ? speed() : 90;

    if (moving) game.scroll += v * dt;
    for (const c of game.clouds) {
      if (moving) c.x -= v * 0.12 * dt;
      if (c.x < -90) { c.x = W + 40; c.y = 30 + Math.random() * 45; }
    }
    for (const d of game.sails) {
      if (moving) d.x -= v * 0.03 * dt;
      if (d.x < -30) { d.x = W + rnd(40, 300); d.s = rnd(0.5, 0.9); }
    }
    game.untilGull -= dt;
    if (game.untilGull <= 0) {
      game.gulls.push({ x: W + 20, y: rnd(16, 72), vx: rnd(40, 75), t: rnd(0, 6), s: rnd(0.7, 1) });
      game.untilGull = rnd(3, 8);
    }
    for (const g of game.gulls) { g.x -= (g.vx + (moving ? v * 0.2 : 0)) * dt; g.t += dt * 9; }
    game.gulls = game.gulls.filter(g => g.x > -30);

    if (game.state === 'playing') {
      game.wakeT -= dt;
      if (game.wakeT <= 0) {
        const p = shipPoint(-30, 14);
        spawnParticle(p.x, p.y, -v * 0.5, rnd(-12, 12), rnd(3, 5), 0.45, Math.random() < 0.6 ? '#ffffff' : '#bdf0f5', 0);
        game.wakeT = 0.035;
      }
    }
    for (const f of game.flashes) f.life -= dt;
    game.flashes = game.flashes.filter(f => f.life > 0);
    game.scorePop = Math.max(0, game.scorePop - dt * 4);
    if (game.banner) { game.banner.life -= dt; if (game.banner.life <= 0) game.banner = null; }

    if (game.state === 'menu') {
      s.y = H * 0.45 + Math.sin(game.t * 2.5) * 10;
      s.tilt = Math.sin(game.t * 2.5 + 1) * 0.08;
    } else if (game.state === 'playing') {
      s.vy = Math.min(MAX_FALL, s.vy + GRAVITY * dt);
      s.y += s.vy * dt;
      if (s.y < CEILING) { s.y = CEILING; s.vy = Math.max(0, s.vy); }
      const target = Math.max(-0.45, Math.min(0.6, s.vy / 800));
      s.tilt += (target - s.tilt) * Math.min(1, dt * 10);
      s.stretch = Math.max(0, s.stretch - dt * 5);

      updateStorm(dt);
      for (const r of game.reefs) {
        r.x -= v * dt;
        if (!r.passed && r.x + REEF_W < SHIP_X) {
          r.passed = true;
          onReefPassed();
        }
        const p = r.pickup;
        if (p && !p.taken) {
          const px = r.x + PICKUP_DX;
          if (shipCircles().some(c => (c.x - px) ** 2 + (c.y - p.y) ** 2 < (c.r + 16) ** 2)) collect(p, px);
        }
      }
      game.reefs = game.reefs.filter(r => r.x + PICKUP_DX > -40);
      // The man-o'-war fight is in open water: no new reefs until it's sunk.
      if (!game.boss) {
        game.untilReef -= v * dt;
        if (game.untilReef <= 0) { spawnReef(); game.untilReef += REEF_SPACING; }
      }

      updateCombat(dt, v);
      if (game.state === 'playing' && shipCollides()) wreck('reef');
    } else {
      // Wrecked: the ship tumbles and sinks to the sand.
      game.deadT += dt;
      s.vy = Math.min(MAX_FALL, s.vy + GRAVITY * dt);
      s.y = Math.min(FLOOR - 8, s.y + s.vy * dt);
      if (s.y < FLOOR - 8) s.tilt += dt * 6;
    }

    for (const p of game.particles) {
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    game.particles = game.particles.filter(p => p.life > 0);
    for (const p of game.popups) { p.y -= 40 * dt; p.life -= dt; }
    game.popups = game.popups.filter(p => p.life > 0);
    game.shake = Math.max(0, game.shake - dt * 40);
  }

  // ---------- render ----------

  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = sh => Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }

  function drawBackground() {
    // The weather turns as the run gets harder.
    const storm = game.state === 'menu' ? 0 : Math.max(Math.min(1, game.passed / 45) * 0.7, game.storm.k);
    const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
    sky.addColorStop(0, mix('#2e8fe6', '#34405e', storm));
    sky.addColorStop(1, mix('#9fdcff', '#8795b0', storm));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, HORIZON + 2);

    for (const c of game.clouds) Art.cloud(ctx, c.x, c.y, c.s);
    for (const g of game.gulls) Art.gull(ctx, g.x, g.y, g.t, g.s);

    const sea = ctx.createLinearGradient(0, HORIZON, 0, H);
    sea.addColorStop(0, mix('#2fc3e0', '#2b8ea6', storm));
    sea.addColorStop(1, mix('#0b56a3', '#0a3a6e', storm));
    ctx.fillStyle = sea;
    ctx.fillRect(0, HORIZON, W, H - HORIZON);

    ctx.strokeStyle = Art.INK;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, HORIZON); ctx.lineTo(W, HORIZON); ctx.stroke();
    for (const d of game.sails) Art.distantSail(ctx, d.x, HORIZON - 3, d.s);
    Art.island(ctx, W + 120 - ((game.scroll * 0.06 + 300) % (W + 260)), HORIZON + 2);

    // Rows of little cartoon wave marks, farther rows scroll slower.
    ctx.lineCap = 'round';
    for (let row = 0; row < 5; row++) {
      const y = HORIZON + 30 + row * 62;
      const k = 0.3 + row * 0.18;
      const spacing = 130;
      const off = (game.scroll * k + row * 47) % spacing;
      ctx.strokeStyle = `rgba(255,255,255,${0.35 + row * 0.08})`;
      ctx.lineWidth = 2 + row * 0.5;
      for (let x = -off; x < W + spacing; x += spacing) {
        const bob = Math.sin(game.t * 2 + x * 0.05 + row) * (3 + game.storm.k * 6);
        const wx = x + (row % 2) * 60;
        ctx.beginPath();
        ctx.moveTo(wx, y + bob);
        ctx.quadraticCurveTo(wx + 9, y - 7 + bob, wx + 18, y + bob);
        ctx.quadraticCurveTo(wx + 27, y - 7 + bob, wx + 36, y + bob);
        ctx.stroke();
      }
    }
  }

  function drawFloor() {
    ctx.fillStyle = '#e8c274';
    ctx.strokeStyle = Art.INK;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, H + 10);
    const off = game.scroll % 80;
    for (let x = -off - 80; x <= W + 80; x += 20) {
      ctx.lineTo(x, FLOOR + Math.sin((x + off) * 0.08) * 3);
    }
    ctx.lineTo(W + 80, H + 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  const wrap = (n, m) => ((n % m) + m) % m;

  function drawRain() {
    const st = game.storm;
    if (st.k < 0.02) return;
    const slant = 0.35 + st.gust / 600;     // the wind leans the rain
    ctx.strokeStyle = `rgba(215,228,255,${0.45 * st.k})`;
    ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < 90; i++) {
      const x = wrap(i * 137.5 - game.t * 160, W + 100) - 50;
      const y = wrap(i * 71.3 + game.t * 620, H + 40) - 20;
      ctx.moveTo(x, y);
      ctx.lineTo(x - slant * 18, y + 18);
    }
    ctx.stroke();
    if (st.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${st.flash * 0.55})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawParticles() {
    for (const p of game.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const MENU_X = 480;           // right of the bobbing ship
  const PAUSE_BTN = { x: 34, y: 34, r: 20 };

  function drawGameOver() {
    const drop = Math.min(1, game.deadT / 0.35);      // scroll slides down into place
    const y0 = 110 - (1 - drop) * 40;
    ctx.globalAlpha = drop;
    Art.text(ctx, 'SHIPWRECKED!', W / 2, y0 - 42, 50, '#ff7a9c');
    const pw = 360, ph = 190, px = W / 2 - pw / 2;
    Art.panel(ctx, px, y0, pw, ph);
    Art.label(ctx, 'Score', px + 40, y0 + 40, 22, '#6b4a22', 'left');
    Art.label(ctx, String(game.score), px + pw - 40, y0 + 40, 30, Art.INK, 'right');
    Art.label(ctx, 'Best', px + 40, y0 + 78, 22, '#6b4a22', 'left');
    Art.label(ctx, String(game.best), px + pw - 40, y0 + 78, 26, Art.INK, 'right');
    ctx.strokeStyle = '#d7b87e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px + 30, y0 + 102); ctx.lineTo(px + pw - 30, y0 + 102); ctx.stroke();
    Art.label(ctx, `Reefs ${game.passed}   ·   Frigates ${game.sunk.frigate}   ·   Galleons ${game.sunk.galleon}`,
      W / 2, y0 + 128, 15, '#6b4a22');
    Art.label(ctx, `Treasure ${game.treasure}   ·   Men-o'-war ${game.bossesBeaten}`, W / 2, y0 + 154, 15, '#6b4a22');
    if (game.newBest) Art.ribbon(ctx, W / 2, y0 - 2, 150, 'NEW BEST!', -0.04 + Math.sin(game.t * 3) * 0.02);
    ctx.globalAlpha = 1;
    if (game.deadT >= 0.7) {
      ctx.globalAlpha = 0.6 + Math.sin(game.t * 5) * 0.4;
      Art.text(ctx, 'Tap to sail again', W / 2, y0 + ph + 40, 22, '#fff');
      ctx.globalAlpha = 1;
    }
  }
  const TOUCH = window.matchMedia('(pointer: coarse)').matches;

  function drawUI() {
    if (game.state === 'menu') {
      const wob = Math.sin(game.t * 3) * 0.04;
      if (logo.complete && logo.naturalWidth) {
        const h = 270, w = h * logo.naturalWidth / logo.naturalHeight;
        ctx.save();
        ctx.translate(MENU_X, 18 + h / 2 + Math.sin(game.t * 2.6) * 4);
        ctx.rotate(wob * 0.5);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(logo, -w / 2, -h / 2, w, h);
        ctx.restore();
      } else {
        ctx.save();
        ctx.translate(MENU_X, 140);
        ctx.rotate(wob);
        Art.text(ctx, 'REEF RUNNER', 0, 0, 64, '#ffd34e');
        ctx.restore();
      }
      Art.text(ctx, 'Tap, click or press Space to set sail!', MENU_X, 316, 22);
      Art.text(ctx, TOUCH ? 'Left side: sail up  ·  Right side: FIRE!' : 'Space / click: sail up  ·  F / right-click: FIRE!',
        MENU_X, 346, 16, '#ffd34e');
      if (game.best > 0) Art.text(ctx, `Best: ${game.best}`, MENU_X, 378, 18, '#bdf0f5');
    } else if (game.state === 'playing') {
      ctx.save();
      ctx.translate(W / 2, 50);
      ctx.scale(1 + game.scorePop * 0.35, 1 + game.scorePop * 0.35);
      Art.text(ctx, String(game.score), 0, 0, 52, game.scorePop > 0.5 ? '#ffe14d' : '#fff');
      ctx.restore();
      const cooldown = game.rapid > 0 ? RAPID_COOLDOWN : FIRE_COOLDOWN;
      Art.fireButton(ctx, W - 50, H - 78, 30, 1 - game.reload / cooldown, game.rapid > 0 ? 'RUM!' : TOUCH ? 'FIRE' : 'F');
      if (game.rapid > 0) {
        ctx.strokeStyle = '#ff5a3a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(W - 50, H - 78, 36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (game.rapid / RAPID_TIME));
        ctx.stroke();
      }
      const B = game.boss;
      if (B && B.state !== 'sinking') Art.bossBar(ctx, W / 2, 98, 300, B.hp / B.maxHp, 'HMS INVINCIBLE');
      if (game.banner) {
        const bn = game.banner, age = bn.max - bn.life;
        const pop = age < 0.15 ? age / 0.15 : 1;
        ctx.globalAlpha = Math.min(1, bn.life * 2);
        ctx.save();
        ctx.translate(W / 2, 170);
        ctx.scale(0.6 + pop * 0.4, 0.6 + pop * 0.4);
        Art.text(ctx, bn.title, 0, 0, 50, '#ffd34e');
        if (bn.sub) Art.text(ctx, bn.sub, 0, 42, 20);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
      Art.pauseButton(ctx, PAUSE_BTN.x, PAUSE_BTN.y, PAUSE_BTN.r, game.paused);
      if (game.paused) {
        ctx.fillStyle = 'rgba(10,30,45,0.45)';
        ctx.fillRect(0, 0, W, H);
        Art.text(ctx, 'PAUSED', W / 2, H / 2 - 20, 56, '#ffd34e');
        Art.text(ctx, TOUCH ? 'Tap to keep sailing' : 'Press P or click to keep sailing', W / 2, H / 2 + 30, 20);
      }
    } else {
      drawGameOver();
    }
    Art.text(ctx, Sfx.muted ? '🔇 M' : '🔊 M', W - 14, H - 14, 13, '#fff', 'right');
  }

  function render() {
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = '#0d3b4f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const k = view.scale * view.dpr;
    const sx = game.shake ? (Math.random() - 0.5) * game.shake : 0;
    const sy = game.shake ? (Math.random() - 0.5) * game.shake : 0;
    ctx.setTransform(k, 0, 0, k, view.ox * view.dpr, view.oy * view.dpr);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    ctx.translate(sx, sy);

    drawBackground();
    // Enemy ships sail behind the reefs; sandbars give both sides cover.
    for (const e of game.enemies) {
      const charge = e.state === 'fight' && e.fireT < 0.45 ? 1 - e.fireT / 0.45 : 0;
      const jolt = e.flash > 0 ? Math.sin(e.flash * 90) * 4 : 0;
      const y = e.y + Math.sin(game.t * 2.2 + e.station) * 3;
      Art[e.kind](ctx, e.x + jolt, y, game.t, e.sink, charge);
      if (e.T.hp > 1 && e.state !== 'sinking') Art.pips(ctx, e.x, y - e.T.box.top - 12, e.hp, e.T.hp);
    }
    const B = game.boss;
    if (B) {
      const nextIsWall = (B.attacks + 1) % 3 === 0;
      const charge = B.state === 'fight' && B.wall <= 0 && !nextIsWall && B.attackT < 0.45 ? 1 - B.attackT / 0.45 : 0;
      const jolt = B.flash > 0 ? Math.sin(B.flash * 90) * 4 : 0;
      Art.manOWar(ctx, B.x + jolt, B.y + Math.sin(game.t * 1.6) * 3, game.t, B.sink, charge, B.wall > 0 ? 1 - B.wall / 0.9 : 0);
    }
    for (const r of game.reefs) {
      Art.stormCloud(ctx, r.x, r.top, REEF_W, r.look, game.t);
      Art.sandbar(ctx, r.x, r.bottom, REEF_W, H + 10, r.look);
    }
    for (const r of game.reefs) {
      const p = r.pickup;
      if (p && !p.taken) Art[p.kind === 'chest' ? 'chest' : 'barrel'](ctx, r.x + PICKUP_DX, p.y, game.t + r.x * 0.01);
    }
    const s = game.ship;
    for (const b of game.balls) Art.cannonball(ctx, b.x, b.y, 5);
    for (const b of game.shots) Art.cannonball(ctx, b.x, b.y, b.r);
    Art.ship(ctx, SHIP_X, s.y, s.tilt, s.stretch, game.t, SHIP_SCALE);
    for (const f of game.flashes) Art.burst(ctx, f.x, f.y, f.r, '', f.x);
    drawParticles();
    drawFloor();
    drawRain();
    for (const p of game.popups) {
      if (p.burst) {
        const age = p.max - p.life;
        const pop = age < 0.1 ? age / 0.1 * 1.15 : 1 + Math.max(0, 0.15 - (age - 0.1));
        ctx.globalAlpha = Math.min(1, p.life * 5);
        Art.burst(ctx, p.x, p.y, p.r * pop, p.text, p.spin);
      } else {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        Art.text(ctx, p.text, p.x, p.y, 28, '#ffd34e');
      }
    }
    ctx.globalAlpha = 1;
    drawUI();
    ctx.restore();
  }

  // ---------- plumbing ----------

  function resize() {
    const cw = window.innerWidth, ch = window.innerHeight;
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cw * view.dpr);
    canvas.height = Math.round(ch * view.dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    view.scale = Math.min(cw / W, ch / H);
    view.ox = (cw - W * view.scale) / 2;
    view.oy = (ch - H * view.scale) / 2;
  }

  function setPaused(on) {
    if (game.state !== 'playing' || game.paused === on) return;
    game.paused = on;
    Sfx.pause();
  }

  // Screen point → 800x450 stage point.
  const toStage = e => ({ x: (e.clientX - view.ox) / view.scale, y: (e.clientY - view.oy) / view.scale });

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
  window.addEventListener('blur', () => setPaused(true));
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'KeyP' || e.code === 'Escape') { setPaused(!game.paused); return; }
    if (game.paused) { e.preventDefault(); setPaused(false); return; }
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); flap(); }
    if (e.code === 'KeyF' || e.code === 'KeyX' || e.code === 'ArrowRight' || e.code === 'Enter') { e.preventDefault(); fire(); }
    if (e.code === 'KeyM') Sfx.toggleMute();
  });
  // Mouse: left button sails up, right button fires. Touch: left half sails up, right half fires.
  window.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (game.paused) { setPaused(false); return; }
    const p = toStage(e);
    if (game.state === 'playing' && (p.x - PAUSE_BTN.x) ** 2 + (p.y - PAUSE_BTN.y) ** 2 < (PAUSE_BTN.r + 8) ** 2) {
      setPaused(true);
      return;
    }
    const fireZone = e.pointerType === 'mouse' ? e.button === 2 : e.clientX > window.innerWidth / 2;
    if (fireZone && game.state === 'playing') fire();
    else flap();
  });
  window.addEventListener('contextmenu', e => e.preventDefault());

  // Fixed timestep so physics feel the same at 60 Hz and 120 Hz.
  let last = performance.now();
  let acc = 0;
  function frame(now) {
    acc += Math.min(0.25, (now - last) / 1000);
    last = now;
    if (game.paused) acc = 0;
    while (acc >= TICK) { update(TICK); acc -= TICK; }
    render();
    requestAnimationFrame(frame);
  }

  if (GOD) {
    window.reef = game;
    // Advance the simulation by `secs` and draw, even when the tab is hidden.
    window.reefStep = secs => { for (let i = 0; i < secs / TICK; i++) update(TICK); render(); };
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
